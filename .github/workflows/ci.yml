name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang-Format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check Formatting
        run: find src tests \( -name '*.c' -o -name '*.h' \) | xargs clang-format --dry-run --Werror
      - name: Check Zero Comments
        run: bash tools/check_zero_comments.sh

  build-and-test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-latest, macos-latest ]
        build_type: [ Release ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libsqlite3-dev zlib1g-dev libexpat1-dev libpng-dev xvfb valgrind

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config gtk4 sqlite zlib expat libpng create-dmg

      - name: Setup Windows Environment
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-expat
            mingw-w64-x86_64-libpng

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Configure CMake
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          fi

      - name: Build All Targets (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Build All Targets
        if: runner.os != 'Windows'
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Execute Tests (Linux Headless)
        if: runner.os == 'Linux'
        run: xvfb-run ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

      - name: Execute Tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

      - name: Execute Tests (macOS)
        if: runner.os == 'macOS'
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          powershell -ExecutionPolicy Bypass -File packaging/windows/collect_dependencies.ps1
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc packaging/windows/setup.iss
            if (Test-Path dist-installer) {
              Copy-Item dist-installer/*.exe dist/ -Force
            }
          }

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          bash packaging/linux/build_appimage.sh
          mkdir -p dist
          mv GradeGoal*.AppImage dist/ 2>/dev/null || true

      - name: Package macOS
        if: runner.os == 'macOS'
        run: bash packaging/macos/build_dmg.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GradeGoal-Installer-${{ runner.os }}
          path: |
            dist
            dist-installer
          if-no-files-found: ignore
